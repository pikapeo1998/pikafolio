<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pikapeo Blog</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #030008;
      --panel: rgba(14, 7, 22, 0.72);
      --panel-strong: rgba(20, 10, 36, 0.9);
      --purple: #a855f7;
      --pink: #ec4899;
      --text: #f3f4f6;
      --muted: #b4b2bc;
      --line: rgba(168, 85, 247, 0.22);
    }

    body {
      font-family: 'Space Grotesk', sans-serif;
      background:
        radial-gradient(circle at top left, rgba(168, 85, 247, 0.14), transparent 30%),
        radial-gradient(circle at bottom right, rgba(236, 72, 153, 0.12), transparent 35%),
        #030008;
      color: var(--text);
      overflow-x: hidden;
    }

    .grid-bg {
      background-image:
        linear-gradient(to right, rgba(168, 85, 247, 0.04) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(168, 85, 247, 0.04) 1px, transparent 1px);
      background-size: 38px 38px;
    }

    .glass {
      background: var(--panel);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.05);
    }

    .tech-mono {
      font-family: 'Share Tech Mono', monospace;
    }

    .neon-text {
      text-shadow: 0 0 12px rgba(168, 85, 247, 0.5), 0 0 24px rgba(236, 72, 153, 0.35);
    }

    .post-card {
      transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
    }

    .post-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 18px 40px rgba(168, 85, 247, 0.15);
      border-color: rgba(236, 72, 153, 0.5);
    }
  </style>
</head>
<body class="grid-bg min-h-screen">
  <nav class="fixed top-0 left-0 w-full z-50 glass border-b border-purple-900/30">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
      <a href="index.html" class="cursor-pointer select-none">
        <span class="text-2xl font-bold tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-500">PIKAPEO._</span>
        <span class="tech-mono text-[9px] text-pink-500/80 block tracking-[0.2em] -mt-1 pl-1">LABS SYSTEM v4.5</span>
      </a>

      <div class="hidden md:flex items-center space-x-8 text-sm tracking-widest uppercase text-gray-400">
        <a href="index.html#about" class="hover:text-purple-400 transition-colors">About</a>
        <a href="index.html#work" class="hover:text-purple-400 transition-colors">Work</a>
        <a href="blog.html" class="text-pink-400 font-medium">Blog</a>
        <a href="index.html#ai-playground" class="text-pink-500 font-medium">AI Playground</a>
      </div>

      <a href="index.html" class="tech-mono text-xs px-4 py-2 border border-purple-500/40 rounded bg-purple-950/20 hover:bg-purple-800/30 transition-all">
        ← HOME
      </a>
    </div>
  </nav>

  <main class="max-w-6xl mx-auto px-6 pt-28 pb-16">
    <section class="mb-12">
      <div class="inline-flex items-center gap-2 px-3 py-1 border border-pink-500/30 rounded-full bg-pink-950/20 text-pink-400 text-[10px] tracking-[0.2em] uppercase tech-mono">
        <span class="w-2 h-2 rounded-full bg-pink-500"></span>
        Pikapeo Journal
      </div>

      <div class="mt-6 flex flex-col lg:flex-row lg:items-end lg:justify-between gap-6">
        <div>
          <h1 class="text-4xl md:text-6xl font-black uppercase tracking-tight neon-text">
            Ideas, notes <span class="text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-500">& stories</span>
          </h1>
        </div>
        <div id="post-count" class="tech-mono text-xs text-gray-400 uppercase tracking-[0.2em]">
  Loading articles...
</div>
      </div>
    </section>

    <section class="grid grid-cols-1 xl:grid-cols-[1.5fr_0.8fr] gap-8">
  <!-- Khu vực bài viết -->
  <div id="posts-container" class="space-y-8">
    <div class="glass rounded-2xl p-8 text-center text-purple-300">
      Đang tải bài viết...
    </div>
  </div>

  <!-- Sidebar -->
  <aside class="space-y-6">
    <div class="glass rounded-2xl border border-purple-900/40 p-5">
      <div class="tech-mono text-[10px] uppercase tracking-[0.24em] text-pink-400 mb-4">
        Categories
      </div>
      <div id="categories-container" class="flex flex-wrap gap-2">
        <span class="text-gray-400 text-xs">Đang tải danh mục...</span>
      </div>
    </div>

    <div class="glass rounded-2xl border border-purple-900/40 p-5">
      <div class="tech-mono text-[10px] uppercase tracking-[0.24em] text-pink-400 mb-4">
        Latest notes
      </div>
      <ul id="latest-container" class="space-y-4 text-sm text-gray-300">
        <li>Đang tải...</li>
      </ul>
    </div>
  </aside>
</section>
  </main>

<script type="module">
  import {
    getPosts,
    getCategories,
    getImageUrl
  } from './blog/sanity-client.js';

  const postsContainer = document.getElementById('posts-container');
  const categoriesContainer = document.getElementById('categories-container');
  const latestContainer = document.getElementById('latest-container');

  // Tránh nội dung từ CMS bị hiểu thành mã HTML
  function escapeHTML(value = '') {
    return String(value).replace(/[&<>"']/g, char => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    })[char]);
  }

  function formatDate(date) {
    if (!date) return 'Chưa cập nhật ngày';

    return new Date(date).toLocaleDateString('en-US', {
      month: 'short',
      day: '2-digit',
      year: 'numeric'
    });
  }

  function postUrl(post) {
    return `blog/post.html?slug=${encodeURIComponent(post.slug)}`;
  }

  function renderPostCard(post) {
    const image = getImageUrl(post.thumbnail, 900);

    return `
      <article class="post-card glass rounded-2xl overflow-hidden border border-purple-900/40">
        <a href="${postUrl(post)}" class="block">
          <div class="h-44 p-4 flex items-end bg-gradient-to-br from-[#12091f] to-[#2d0d47]"
               ${image ? `style="background-image:linear-gradient(to top,rgba(0,0,0,.4),transparent),url('${escapeHTML(image)}');background-size:cover;background-position:center"` : ''}>
            <span class="inline-flex px-2 py-1 rounded-full bg-black/40 border border-white/10 text-[9px] uppercase tracking-[0.2em] tech-mono">
              ${escapeHTML(post.category || 'Journal')}
            </span>
          </div>
          <div class="p-5">
            <div class="text-[10px] uppercase tracking-[0.2em] text-purple-300 tech-mono mb-3">
              ${formatDate(post.publishedAt)}
            </div>
            <h3 class="text-xl font-bold mb-2">${escapeHTML(post.title)}</h3>
            <p class="text-sm text-gray-300 leading-relaxed">
              ${escapeHTML(post.excerpt || '')}
            </p>
            <span class="inline-block mt-5 text-pink-400 tech-mono text-[11px] uppercase tracking-[0.2em]">
              Read article →
            </span>
          </div>
        </a>
      </article>
    `;
  }

  function renderFeaturedPost(post) {
    const image = getImageUrl(post.thumbnail, 1400);

    return `
      <article class="post-card glass rounded-2xl overflow-hidden border border-purple-900/40">
        <a href="${postUrl(post)}" class="block">
          <div class="h-60 bg-gradient-to-br from-purple-600 via-fuchsia-500 to-pink-500 p-6 flex items-end"
               ${image ? `style="background-image:linear-gradient(to top,rgba(0,0,0,.35),transparent),url('${escapeHTML(image)}');background-size:cover;background-position:center"` : ''}>
            <div class="inline-flex items-center px-3 py-1 rounded-full bg-black/30 border border-white/15 text-[10px] uppercase tracking-[0.25em] tech-mono">
              Featured
            </div>
          </div>
          <div class="p-6">
            <div class="flex items-center justify-between flex-wrap gap-2 text-[10px] uppercase tracking-[0.2em] text-purple-300 tech-mono mb-4">
              <span>${escapeHTML(post.category || 'Journal')}</span>
              <span>${formatDate(post.publishedAt)}</span>
            </div>
            <h2 class="text-2xl md:text-3xl font-bold mb-3">${escapeHTML(post.title)}</h2>
            <p class="text-gray-300 leading-relaxed">
              ${escapeHTML(post.excerpt || '')}
            </p>
            <span class="inline-block mt-6 text-pink-400 tech-mono text-[11px] uppercase tracking-[0.2em]">
              Read article →
            </span>
          </div>
        </a>
      </article>
    `;
  }

  async function loadBlog() {
    try {
      const [posts, categories] = await Promise.all([
        getPosts(),
        getCategories()
      ]);

      // Hiển thị số lượng bài viết
      const countElement = document.getElementById('post-count');
      if (countElement) {
        countElement.textContent = `${posts.length} articles / 2026`;
      }

      // Hiển thị bài viết
      if (!posts.length) {
        postsContainer.innerHTML = `
          <div class="glass rounded-2xl p-8 text-center text-gray-300">
            Chưa có bài viết nào được xuất bản.
          </div>
        `;
      } else {
        const featured = posts[0];
        const remaining = posts.slice(1);

        postsContainer.innerHTML =
          renderFeaturedPost(featured) +
          (remaining.length
            ? `<div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                ${remaining.map(renderPostCard).join('')}
               </div>`
            : '');
      }

      // Hiển thị danh mục
      categoriesContainer.innerHTML = categories.length
        ? categories.map(category => `
            <span class="px-3 py-1.5 rounded-full border border-purple-500/30 bg-purple-950/20 text-purple-300 text-xs">
              ${escapeHTML(category.title)}
            </span>
          `).join('')
        : '<span class="text-gray-400 text-xs">Chưa có danh mục.</span>';

      // Hiển thị bài viết mới nhất ở sidebar
      latestContainer.innerHTML = posts.length
        ? posts.slice(0, 3).map(post => `
            <li class="border-b border-purple-900/30 pb-3">
              <div class="text-[10px] uppercase tracking-[0.16em] text-purple-300 tech-mono mb-1">
                ${escapeHTML(post.category || 'Journal')}
              </div>
              <a href="${postUrl(post)}" class="hover:text-pink-400 transition-colors">
                ${escapeHTML(post.title)}
              </a>
            </li>
          `).join('')
        : '<li class="text-gray-400">Chưa có bài viết.</li>';

    } catch (error) {
      console.error('Sanity Blog Error:', error);

      postsContainer.innerHTML = `
        <div class="glass rounded-2xl p-8 text-center text-pink-300">
          Không thể tải bài viết. Vui lòng kiểm tra kết nối Sanity.
        </div>
      `;
    }
  }

  loadBlog();
</script>
</body>
</html>

</body>
</html>
