<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog Detail</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Space Grotesk', sans-serif;
      background: radial-gradient(circle at top left, rgba(168,85,247,0.12), transparent 30%), #030008;
      color: #f3f4f6;
    }
    .grid-bg { background-image: linear-gradient(to right, rgba(168,85,247,0.04) 1px, transparent 1px), linear-gradient(to bottom, rgba(168,85,247,0.04) 1px, transparent 1px); background-size: 38px 38px; }
    .glass { background: rgba(14,7,22,0.72); border: 1px solid rgba(255,255,255,0.05); backdrop-filter: blur(10px); }
    .tech-mono { font-family: 'Share Tech Mono', monospace; }
    .neon-text { text-shadow: 0 0 12px rgba(168, 85, 247, 0.5), 0 0 24px rgba(236, 72, 153, 0.35); }
  </style>
</head>
<body class="grid-bg min-h-screen">
  <nav class="fixed top-0 left-0 w-full z-50 glass border-b border-purple-900/30">
    <div class="max-w-5xl mx-auto px-6 py-4 flex justify-between items-center">
      <a href="../index.html" class="cursor-pointer select-none">
        <span class="text-2xl font-bold tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-500">PIKAPEO._</span>
        <span class="tech-mono text-[9px] text-pink-500/80 block tracking-[0.2em] -mt-1 pl-1">LABS SYSTEM v4.5</span>
      </a>
      <div class="flex items-center gap-3">
<a href="../blog.html" class="tech-mono text-xs uppercase px-4 py-2 border border-pink-500/40 rounded bg-pink-950/20 text-pink-300 hover:bg-pink-800/30 transition-all">← Quay lại Blog</a>        <a href="../index.html" class="tech-mono text-[10px] uppercase tracking-[0.2em] text-gray-300 hover:text-white transition-colors">Home</a>
      </div>
    </div>
  </nav>

  <main class="max-w-4xl mx-auto px-6 pt-28 pb-20">
    <article id="post-content" class="glass rounded-3xl overflow-hidden border border-purple-900/40">
      <div id="hero" class="h-72 md:h-80 bg-gradient-to-br from-purple-600 via-fuchsia-500 to-pink-500"></div>
      <div class="p-6 md:p-10">
        <div id="meta" class="flex items-center justify-between gap-3 text-[10px] uppercase tracking-[0.2em] text-purple-300 tech-mono mb-5"></div>
        <h1 id="title" class="text-3xl md:text-5xl font-black uppercase mb-6 neon-text"></h1>
        <div id="excerpt" class="text-lg text-gray-300 leading-relaxed mb-8"></div>
        <div id="body" class="space-y-5 text-gray-200 leading-8 text-base md:text-lg"></div>
      </div>
    </article>
  </main>

  
<script type="module">
  import { getPostBySlug, getImageUrl } from './sanity-client.js';

  const params = new URLSearchParams(window.location.search);
  const slug = params.get('slug');

  const hero = document.getElementById('hero');
  const meta = document.getElementById('meta');
  const title = document.getElementById('title');
  const excerpt = document.getElementById('excerpt');
  const body = document.getElementById('body');

  // Chống lỗi HTML khi hiển thị nội dung
  function escapeHTML(value = '') {
    return String(value).replace(/[&<>"']/g, char => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    })[char]);
  }

  // Định dạng ngày đăng
  function formatDate(date) {
    if (!date) return '';

    return new Date(date).toLocaleDateString('vi-VN', {
      day: '2-digit',
      month: 'long',
      year: 'numeric'
    });
  }

  // Hiển thị nội dung Portable Text từ Sanity
  function renderPortableText(blocks = []) {
    if (!Array.isArray(blocks)) {
      return `<p>${escapeHTML(blocks)}</p>`;
    }

    return blocks.map(block => {
      // Hình ảnh trong nội dung bài viết
      if (block._type === 'image') {
        const image = getImageUrl(block.asset?._ref, 1200);

        if (!image) return '';

        return `
          <figure class="my-8">
            <img
              src="${escapeHTML(image)}"
              alt="${escapeHTML(block.alt || '')}"
              class="w-full rounded-2xl"
              loading="lazy"
            >
            ${block.caption ? `
              <figcaption class="text-center text-sm text-gray-400 mt-3">
                ${escapeHTML(block.caption)}
              </figcaption>
            ` : ''}
          </figure>
        `;
      }

      if (block._type !== 'block') return '';

      const children = (block.children || []).map(child => {
        let content = escapeHTML(child.text || '');

        (child.marks || []).forEach(mark => {
          if (mark === 'strong') content = `<strong>${content}</strong>`;
          if (mark === 'em') content = `<em>${content}</em>`;
          if (mark === 'underline') content = `<u>${content}</u>`;
          if (mark === 'code') content = `<code>${content}</code>`;

          const link = (block.markDefs || []).find(item => item._key === mark);

          if (link?._type === 'link') {
            const url = link.href || '';
            if (/^https?:\/\//i.test(url)) {
              content = `<a href="${escapeHTML(url)}" target="_blank" rel="noopener noreferrer" class="text-pink-400 hover:text-purple-300 underline">${content}</a>`;
            }
          }
        });

        return content;
      }).join('');

      const style = block.style || 'normal';

      const tags = {
        h1: 'h2',
        h2: 'h2',
        h3: 'h3',
        h4: 'h4',
        blockquote: 'blockquote',
        normal: 'p'
      };

      const tag = tags[style] || 'p';

      if (style === 'blockquote') {
        return `<blockquote class="border-l-4 border-purple-500 pl-5 italic text-purple-200 my-6">${children}</blockquote>`;
      }

      if (block.listItem === 'bullet') {
        return `<ul class="list-disc pl-7 my-3"><li>${children}</li></ul>`;
      }

      if (block.listItem === 'number') {
        return `<ol class="list-decimal pl-7 my-3"><li>${children}</li></ol>`;
      }

      return `<${tag} class="my-5">${children}</${tag}>`;
    }).join('');
  }

  // Tải bài viết từ Sanity
  async function loadPost() {
    try {
      if (!slug) {
        throw new Error('Không tìm thấy slug bài viết.');
      }

      body.innerHTML = `
        <p class="text-purple-300 tech-mono">LOADING ARTICLE...</p>
      `;

      const article = await getPostBySlug(slug);

      if (!article) {
        throw new Error('Bài viết không tồn tại hoặc chưa được xuất bản.');
      }

      // SEO
      document.title = article.seoTitle || article.title;

      let description = document.querySelector('meta[name="description"]');

      if (!description) {
        description = document.createElement('meta');
        description.name = 'description';
        document.head.appendChild(description);
      }

      description.content = article.seoDescription || article.excerpt || '';

      // Thông tin bài viết
      title.textContent = article.title || '';
      excerpt.textContent = article.excerpt || '';

      meta.innerHTML = `
        <span>${escapeHTML(article.category || 'Journal')}</span>
        <span>${escapeHTML(formatDate(article.publishedAt))}</span>
      `;

      // Ảnh đại diện
      const image = getImageUrl(article.thumbnail, 1400);

      if (image) {
        hero.style.backgroundImage =
          `linear-gradient(to top, rgba(0,0,0,.35), transparent), url("${image}")`;
        hero.style.backgroundSize = 'cover';
        hero.style.backgroundPosition = 'center';
      }

      // Nội dung bài viết
      body.innerHTML = renderPortableText(article.content || []);

    } catch (error) {
      console.error('Lỗi tải bài viết:', error);

      title.textContent = 'Không thể tải bài viết';

      body.innerHTML = `
        <p class="text-pink-400">
          ${escapeHTML(error.message)}
        </p>
        <a href="index.html" class="text-purple-300 underline">
          ← Quay lại Blog
        </a>
      `;
    }
  }

  loadPost();
</script>

</body>
</html>
